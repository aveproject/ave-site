name: Build and deploy aveproject.org

on:
  # Deploy when the site itself changes
  push:
    branches: [main]

  # Deploy when aveproject/ave publishes new records
  # aveproject/ave triggers this via repository_dispatch on push to main
  repository_dispatch:
    types: [ave-records-updated]

  # Daily: a new catalog release or a change to the implementer guide in
  # aveproject/ave does not trigger the dispatch above (it fires only for
  # records/, schema/, crosswalks/ and dist/), so versions.html and the
  # generated guide would otherwise wait for the next data change
  schedule:
    - cron: "17 5 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      include_drafts:
        description: Include draft records in the build
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a newer run starts
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ave-site
        uses: actions/checkout@v4
        with:
          path: ave-site

      - name: Checkout aveproject/ave (records source)
        uses: actions/checkout@v4
        with:
          repository: aveproject/ave
          path: ave
          # full history and tags: the version strip and versions.html name the
          # newest v* catalog release tag
          fetch-depth: 0
          # If aveproject/ave is private, add:
          # token: ${{ secrets.AVE_REPO_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ave-site/package-lock.json

      - name: Install build dependencies
        working-directory: ave-site
        run: npm ci

      - name: Build records.js from aveproject/ave
        working-directory: ave-site
        run: |
          DRAFTS_FLAG=""
          if [ "${{ github.event.inputs.include_drafts }}" = "true" ]; then
            DRAFTS_FLAG="--include-drafts"
          fi
          node scripts/build-records.js \
            --records-dir ../ave/records \
            --schema      ../ave/schema/ave-record.schema.json \
            --out         records.js \
            $DRAFTS_FLAG

      - name: Publish schema files from aveproject/ave
        working-directory: ave-site
        run: |
          node scripts/publish-schemas.js \
            --schema-dir ../ave/schema \
            --out-dir    schema

      - name: Verify published schema files match aveproject/ave byte for byte
        working-directory: ave-site
        run: |
          AVE_COMMIT=$(git -C ../ave rev-parse HEAD)
          echo "Comparing published schema files against aveproject/ave@$AVE_COMMIT"
          status=0
          for src in ../ave/schema/*.schema.json; do
            f=$(basename "$src")
            if ! cmp -s "$src" "schema/$f"; then
              echo "::error::schema/$f differs from aveproject/ave@$AVE_COMMIT"
              status=1
            fi
          done
          for pub in schema/*.schema.json; do
            if [ ! -f "../ave/schema/$(basename "$pub")" ]; then
              echo "::error::$pub is not in aveproject/ave@$AVE_COMMIT"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "All $(ls schema/*.schema.json | wc -l | tr -d ' ') published schema files match aveproject/ave@$AVE_COMMIT"
          fi
          exit "$status"

      - name: Publish crosswalks from aveproject/ave
        working-directory: ave-site
        run: |
          node scripts/publish-crosswalks.js \
            --crosswalks-dir ../ave/crosswalks \
            --out-dir        crosswalks

      - name: Build site metadata (catalog release, schema version, releases)
        working-directory: ave-site
        env:
          # read-only use of the public Releases API; avoids the unauthenticated rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-site-meta.js --ave-dir ../ave --out site-meta.js

      - name: Generate schema.html and implementer-guide.html from aveproject/ave
        working-directory: ave-site
        run: node scripts/build-pages.js --ave-dir ../ave --out-dir .

      - name: Print build summary
        working-directory: ave-site
        run: |
          RECORD_COUNT=$(node -e "const r=require('./records.js'); console.log(r.length)" 2>/dev/null || echo "unknown")
          SCHEMA_COUNT=$(ls schema/*.schema.json 2>/dev/null | wc -l | tr -d ' ')
          CROSSWALK_COUNT=$(node -e "const m=require('./crosswalks/manifest.json'); console.log(m.files.length)" 2>/dev/null || echo "unknown")
          echo "## Build summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Records built | $RECORD_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema files published | $SCHEMA_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Crosswalks published | $CROSSWALK_COUNT |" >> $GITHUB_STEP_SUMMARY
          META=$(node -e "const m=require('./site-meta.js'); console.log(m.catalog.tag + ' | schema ' + m.latest.schema_version + ', ' + m.latest.record_count + ' records' + (m.latest_is_release ? '' : ', newer than the release'))" 2>/dev/null || echo "unknown")
          echo "| Catalog release, site records | $META |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ave records ref | $(cd ../ave && git rev-parse --short HEAD) |" >> $GITHUB_STEP_SUMMARY
          echo "| Site ref | $(cd ../ave-site && git rev-parse --short HEAD) |" >> $GITHUB_STEP_SUMMARY

      # The artifact is the checkout as it stands, so whatever the build needs but the
      # site does not would be public: templates/ (page sources with placeholders),
      # scripts/ and node_modules/. No page loads from them. Dot-directories such as
      # .github/ are already left out by the upload action.
      - name: Remove build-only files from the Pages artifact
        working-directory: ave-site
        run: |
          rm -rf templates scripts node_modules
          for d in templates scripts node_modules; do
            if [ -e "$d" ]; then
              echo "::error::$d is still in the checkout and would be published"
              exit 1
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ave-site
          # the checkout after the previous step: build-only directories are removed
          # there, since the artifact is the directory as it stands

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
